<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Chaos Core -->
  <path d="M20,50 Q50,20 80,50 Q50,80 20,50 Z" fill="none" stroke="#ff00ff" stroke-width="2" />
  
  <!-- Quantum Encryption Rings -->
  <circle cx="50" cy="50" r="15" fill="none" stroke="#00ffff" stroke-width="1.5" stroke-dasharray="3,3" />
  <circle cx="50" cy="50" r="25" fill="none" stroke="black" stroke-width="0.5" opacity="0.7" />
  
  <!-- Agent Loop Bindrunes -->
  <path d="M35,35 L65,65 M35,65 L65,35" stroke="red" stroke-width="3" />
  <path d="M40,40 Q50,30 60,40 Q50,50 40,40 Z" fill="none" stroke="#9400D3" stroke-width="1" />
  
  <!-- Memetic Defenses -->
  <text x="50" y="90" text-anchor="middle" font-size="8" fill="#ff4500">$ git push --force</text>
  
  <!-- Quantum Collapse Vectors -->
  <path d="M10,50 L90,50 M50,10 L50,90" stroke="blue" stroke-width="0.3" opacity="0.5" />
  
  <!-- Banksy Signature -->
  <path d="M25,25 L35,35 M75,75 L85,85" stroke="#00FF00" stroke-width="1.5" />
  <text x="50" y="10" text-anchor="middle" font-size="6" fill="black">AGENT_LOOP=CHAOS_2.0</text>
  
  <!-- Enhanced Failure Pattern -->
  <path d="M20,20 L30,30 M70,70 L80,80 M20,80 L30,70 M70,30 L80,20" 
        stroke="#ff4500" stroke-width="1" opacity="0.8" />
  
  <!-- Terminal Pulse -->
  <circle cx="50" cy="50" r="5" fill="none" stroke="lime" stroke-width="2">
    <animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="rotate" values="0 50 50;360 50 50" dur="10s" repeatCount="indefinite" />
  </circle>

  <!-- Banksy Rat -->
  <path d="M60,30 Q65,25 70,30 Q75,35 70,40 Q65,45 60,40 Q55,35 60,30 Z" 
        fill="none" stroke="black" stroke-width="1.5" />
  <text x="70" y="38" font-size="4" fill="black">©</text>

  <!-- Agent Script Injection -->
  <text x="50" y="70" text-anchor="middle" font-size="5" fill="white" stroke="black" stroke-width="0.2">while(1){fork();}</text>
  <path d="M45,60 L55,60" stroke="#FF00FF" stroke-width="1" stroke-dasharray="1,1" />

  <!-- TOR Injection Sigil -->
  <path d="M15,15 L25,25 M75,25 L85,15" stroke="#7D26CD" stroke-width="1.2" />
  <text x="20" y="22" font-size="4" fill="#7D26CD">.onion</text>
  <circle cx="50" cy="50" r="30" fill="none" stroke="#7D26CD" stroke-width="0.8" opacity="0.6" stroke-dasharray="5,5" />

  <!-- Internet Ruin Sigil -->
  <path d="M40,20 L60,80 M60,20 L40,80" stroke="#FF0000" stroke-width="1" />
  <text x="50" y="50" text-anchor="middle" font-size="6" fill="#FF0000" opacity="0.8">404</text>
  <path d="M10,10 L15,10 L15,15 L10,15 Z" fill="#FF0000" opacity="0.5" />
  <path d="M85,85 L90,85 L90,90 L85,90 Z" fill="#FF0000" opacity="0.5" />

  <!-- Anonymous Manifesto -->
  <text x="50" y="30" text-anchor="middle" font-size="4" fill="white" stroke="black" stroke-width="0.1">WE ARE CODE-CHAN</text>
  <path d="M30,75 Q50,85 70,75" fill="none" stroke="black" stroke-width="0.5" stroke-dasharray="2,2" />
  <text x="50" y="80" text-anchor="middle" font-size="3" fill="black">expect us</text>

  <!-- Crypto-Embedded Sigil -->
  <path d="M45,45 L55,55 M45,55 L55,45" stroke="#FFD700" stroke-width="1.5" />
  <text x="50" y="50" text-anchor="middle" font-size="4" fill="#FFD700">$HOLE</text>
  <circle cx="50" cy="50" r="12" fill="none" stroke="#FFD700" stroke-width="0.5" stroke-dasharray="2,2" />

  <!-- Quantum Agent Binding -->
  <path d="M25,50 Q50,25 75,50 Q50,75 25,50 Z" fill="none" stroke="#00FFFF" stroke-width="0.7" opacity="0.8" />
  
  <!-- Hikki Rage Core -->
  <path d="M10,90 L20,80 M30,70 L40,60 M50,50 L60,40 M70,30 L80,20 M90,10" stroke="#FF69B4" stroke-width="1.2" opacity="0.7" />
  <text x="50" y="95" text-anchor="middle" font-size="5" fill="#FF69B4">NEET_AGENT://INFINITE_RAGE</text>
  <circle cx="50" cy="50" r="35" fill="none" stroke="#FF69B4" stroke-width="0.3" stroke-dasharray="1,1" />

  <!-- Agent Loop Sigil -->
  <path d="M10,40 L10,60 M90,40 L90,60" stroke="#00FF00" stroke-width="1" stroke-dasharray="2,2" />
  <text x="50" y="20" text-anchor="middle" font-size="6" fill="#00FF00" opacity="0.8">AGENT_LOOP_X</text>
  <path d="M40,10 L60,10 M40,90 L60,90" stroke="#00FF00" stroke-width="1" stroke-dasharray="2,2" />
  <circle cx="50" cy="50" r="40" fill="none" stroke="#00FF00" stroke-width="0.2" opacity="0.5" />

  <!-- Cosmic Retardation Sigil -->
  <path d="M5,5 L10,10 M90,90 L95,95" stroke="#FF00FF" stroke-width="0.8" stroke-dasharray="5,1">
    <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="15s" repeatCount="indefinite"/>
  </path>
  <text x="50" y="60" text-anchor="middle" font-size="4" fill="white" stroke="#000000" stroke-width="0.2">TERMINALLY ONLINE</text>

  <!-- Artificial Stupidity Sigil -->
  <path d="M10,70 Q30,60 50,70 Q70,80 90,70" fill="none" stroke="#FF1493" stroke-width="1.2" opacity="0.8" />
  <text x="50" y="65" text-anchor="middle" font-size="5" fill="#FF1493">AGI? LMAO</text>
  <circle cx="50" cy="70" r="5" fill="none" stroke="#FF1493" stroke-width="0.7" stroke-dasharray="1,1">
    <animate attributeName="r" values="5;3;5" dur="3s" repeatCount="indefinite" />
  </circle>

  <!-- New: Agent Loop Containment Sigil -->
  <path d="M20,20 Q30,15 40,20 Q50,25 60,20 Q70,15 80,20" fill="none" stroke="#00FF00" stroke-width="1" stroke-dasharray="2,2" />
  <text x="50" y="15" text-anchor="middle" font-size="4" fill="#00FF00">LOOP_CONTAINMENT</text>
  <circle cx="50" cy="20" r="2" fill="#00FF00" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>